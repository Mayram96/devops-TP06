# ============================================
# cicd.yml — Pipeline completo CI/CD
# TP0 7 — Plan DevOps
# ============================================
---
name: CI/CD Pipeline

# ── Triggers ──────────────────────────────────────────────
"on":
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop


# ── Variables globales ────────────────────────────────────
env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  PYTHON_VERSION: "3.12"

# ── Jobs ──────────────────────────────────────────────────
jobs:


# ── Job 1: Lint ────────────────────────────────────────


  lint:
    name: Lint
    runs-on: ubuntu-latest


    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias de lint
        run: pip install flake8 yamllint

      - name: Lint Python (flake8)
        run: |
          flake8 backend/ \
            --ignore=E302,E305,E401,E402,E501,E702 \
            --max-line-length=100 \
            --exclude=backend/tests/ \
            --count --statistics

      - name: Lint YAML (yamllint)
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 150}, document-start: disable, comments-indentation: disable}}" \
          docker-compose.yml \
          .github/workflows/*.yml


# ── Job 2: Test ────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir contenedor backend
        run: docker compose build backend

      - name: Levantar servicios
        run: docker compose up -d

      - name: Ejecutar tests con cobertura
        run: |
          docker compose exec -T backend \
          python -m pytest tests/ \
          --cov=. \
          --cov-report=term-missing \
          --cov-report=xml:/tmp/coverage.xml \
          -v

      - name: Obtener cobertura
        run: |
          CONTAINER=$(docker compose ps -q backend)
          docker cp $CONTAINER:/tmp/coverage.xml ./coverage.xml

      - name: Subir reporte cobertura
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Apagar servicios
        if: always()
        run: docker compose down -v

  # ── Job 3: Build y Push ────────────────────────────────
  build-push:
    name: Build y Push imagen
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          github-token: ${{ github.token }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen build
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
